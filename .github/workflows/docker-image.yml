name: Docker Image CI

on:
  push:
    branches: [ "hires_spain", "hires_spain_gpu" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mbenitog/meshtastic-site-spain:latest

  ultra-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ultra backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ultra
          push: true
          tags: |
            ghcr.io/mbenitog/meshtastic-site-spain-ultra:latest
            ghcr.io/mbenitog/meshtastic-site-spain-ultra:${{ github.ref_name }}
